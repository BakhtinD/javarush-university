# 1. Database Driver and URL
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/sakila
hibernate.connection.username=root
hibernate.connection.password=sakila

# 2. MySQL Dialect
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 3. Character Encoding
hibernate.connection.characterEncoding=utf8
hibernate.connection.CharSet=utf8
hibernate.connection.useUnicode=true

# 4. Connection Pool Settings (HIKARICP)
hibernate.hikari.dataSourceClassName=com.mysql.cj.jdbc.MysqlDataSource
hibernate.hikari.connectionTimeout=30000
hibernate.hikari.validationTimeout=5000
hibernate.hikari.idleTimeout=600000
hibernate.hikari.maxLifetime=1800000
hibernate.hikari.minimumIdle=10
hibernate.hikari.maximumPoolSize=20
hibernate.hikari.poolName=HikariPool-Hibernate
hibernate.hikari.autoCommit=false
hibernate.hikari.connectionTestQuery=SELECT 1
hibernate.hikari.leakDetectionThreshold=2000
hibernate.hikari.registerMbeans=true

# 5. Schema Management (DDL Auto)
hibernate.hbm2ddl.auto=create-drop

# 6. SQL Logging Configuration
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.use_sql_comments=true

# 7. Performance Optimization
hibernate.jdbc.batch_size=20
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.jdbc.fetch_size=50

# 8. Transaction Management
hibernate.connection.autocommit=false
hibernate.transaction.factory_class=org.hibernate.transaction.JDBCTransactionFactory